name: Build School Directory

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ./SchoolDirectory/SchoolDirectory.csproj

      - name: Build project
        run: dotnet build ./SchoolDirectory/SchoolDirectory.csproj --configuration Release --no-restore
